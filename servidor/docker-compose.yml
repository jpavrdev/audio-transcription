services:
  db:
    image: postgres:16
    container_name: painel_db
    environment:
      POSTGRES_USER: ${DB_USER:-painel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-painel_dev}
      POSTGRES_DB: ${DB_NAME:-leiloes}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - painel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-painel} -d ${DB_NAME:-leiloes}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  painel_pgdata:
